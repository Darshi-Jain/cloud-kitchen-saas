{% extends "kitchen/base.html" %}
{% block content %}

<h2 class="mb-3">Menu Items</h2>

<table class="table table-hover bg-white shadow-sm">
    <tr>
        <th>Kitchen</th><th>Name</th><th>Category</th><th>Price</th><th>Available</th>
    </tr>
    {% for item in menu_items %}
    <tr>
        <td>{{ item.kitchen.name }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.category }}</td>
        <td>${{ item.price }}</td>
        <td>{{ item.available }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
