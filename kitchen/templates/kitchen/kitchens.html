{% extends "kitchen/base.html" %}
{% block content %}

<div class="d-flex justify-content-between mb-3">
    <h2>Kitchens</h2>
    <a href="/api/ui/kitchens/add/" class="btn btn-primary">Add Kitchen</a>
</div>

<table class="table table-hover bg-white shadow-sm">
    <tr>
        <th>Name</th><th>Location</th><th>Manager</th><th>Status</th><th>Actions</th>
    </tr>
    {% for k in kitchens %}
    <tr>
        <td>{{ k.name }}</td>
        <td>{{ k.location }}</td>
        <td>{{ k.manager }}</td>
        <td><span class="badge bg-success">{{ k.status }}</span></td>
        <td>
            <a href="/api/ui/kitchens/{{ k.id }}/edit/" class="btn btn-sm btn-outline-primary">Edit</a>
            <a href="/api/ui/kitchens/{{ k.id }}/delete/" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
