{% extends "kitchen/base.html" %}
{% block content %}

<div class="d-flex justify-content-between mb-3">
    <h2>Orders</h2>
    <a href="/api/ui/orders/add/" class="btn btn-primary">Add Order</a>
</div>

<table class="table table-hover bg-white shadow-sm">
    <tr>
        <th>Kitchen</th><th>Customer</th><th>Item</th><th>Qty</th><th>Status</th><th>Amount</th><th>Actions</th>
    </tr>
    {% for o in orders %}
    <tr>
        <td>{{ o.kitchen.name }}</td>
        <td>{{ o.customer_name }}</td>
        <td>{{ o.item_name }}</td>
        <td>{{ o.quantity }}</td>
        <td><span class="badge bg-info">{{ o.status }}</span></td>
        <td>${{ o.total_amount }}</td>
        <td>
            <a href="/api/ui/orders/{{ o.id }}/edit/" class="btn btn-sm btn-outline-primary">Edit</a>
            <a href="/api/ui/orders/{{ o.id }}/delete/" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
