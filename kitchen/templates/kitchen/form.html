{% extends "kitchen/base.html" %}
{% block content %}

<div class="card shadow-sm border-0">
    <div class="card-body">
        <h3>{{ title }}</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary">Save</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
